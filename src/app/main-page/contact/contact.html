<section class="contact">
    <div class="contact-info">
        <h2 class="contact-headline">{{'contact.title' | translate}}</h2>
        <p class="contact-tagline" [innerHTML]="'contact.tagline' | translate"></p>
    </div>
    <form class="contact-form">
        <input class="contact-form_input" type="text" name="name" [placeholder]="'contact.namePlaceholder' | translate">
        <input class="contact-form_input" type="email" name="email" [placeholder]="'contact.emailPlaceholder' | translate">
        <textarea class="contact-form_input contact-form_message" name="message" [placeholder]="'contact.messagePlaceholder' | translate"></textarea>
        <label class="contact-form_privacy">
            <input type="checkbox" name="privacy">
            <span>{{'contact.privacyPrefix' | translate}} <a href="#">{{ 'contact.privacyLink' | translate }}</a></span>
        </label>
        <button type="submit" class="contact-form_submit">{{ 'contact.sendButton' | translate}}</button>
    </form>
</section>
