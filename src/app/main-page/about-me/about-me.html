<section class="main-aboutme main-aboutme_content">
    <h2>{{'aboutMe.title_part_one' | translate}} <span>{{'aboutMe.title_part_two' | translate}}</span></h2>
    <article>
        <p>{{ 'aboutMe.firstTagLine' | translate}}</p>
        @if (showMore) {
            <p class="about-me_more" #pathRef>{{'aboutMe.pathTagLine' | translate}}</p>
            <p class="about-me_more">{{'aboutMe.hobbyTagLine' | translate}}</p>
        }
    </article>
    <button (click)="revealMore()">{{ 'aboutMe.moreAboutMeButton' | translate}}</button>
</section>
<section class="main-aboutme main-aboutme_info">
    <section class="info-line" >
        <div class="info-line_picture">
            <img src="/assets/icons/location-pin.svg" alt="">
        </div>
        <div class="info-line_text">
            <p [innerHTML]="'aboutMe.location' | translate"></p>
        </div>
    </section>
    <section class="info-line" >
        <div class="info-line_picture">
            <img src="/assets/icons/lightbulb-icon.svg" alt="">
        </div>
        <div class="info-line_text">
            <p [innerHTML]="'aboutMe.ideas' | translate"></p>
        </div>
    </section>
    <section class="info-line" >
        <div class="info-line_picture">
            <img src="/assets/icons/users-icon.svg" alt="">
        </div>
        <div class="info-line_text">
            <p [innerHTML]="'aboutMe.teamPlayer' | translate"></p>
        </div>
    </section>
</section>
