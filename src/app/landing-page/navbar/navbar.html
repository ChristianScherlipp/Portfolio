<section class="navbar">
    <section class="navbar-logo-text">
        <img src="/assets/icons/logo_chris_header.svg" alt="Logo inizialien von Christian Scherlipp auf Platine">
        <p>Chris<span>tian</span></p>
    </section>
    <Section class="navbar-link">
        <a [routerLink]="['/']" fragment="about-me">{{ 'navbar.aboutMe' | translate }}</a>
        <a [routerLink]="['/']" fragment="skills">{{ 'navbar.skills' | translate}}</a>
        <a href="">{{ 'navbar.myProjects' |translate }}</a>
        <a href="">{{ 'navbar.contact' | translate}}</a>
    </Section>
    <section class="navbar-select-language">
        <span class="navbar-select-language_slider" [class.navbar-select-language_slider--en]="translate.currentLang() === 'en'"></span>
        <button [class.active]="translate.currentLang() === 'de'" (click)="changeLanguage('de')">DE</button>
        <button [class.active]="translate.currentLang() === 'en'" (click)="changeLanguage('en')">EN</button>
    </section>
</section>
